# Online resources for teaching robotics and autonomous systems.
#
# One record per resource. A course that is offered in several ways (university lecture pages, a MOOC,
# a video archive) is ONE record with several `offerings`. Textbooks and software are records of their
# own; courses point to them with `uses_books` / `uses_software`; the page computes the reverse links
# ("used by"). Labs and notebooks built for another course point to it with `derived_from`.
#
# Availability of each material type:
#   free     complete and freely available online
#   partial  some of it is online (some lectures, older years, or only part of the course)
#   paid     available, but not free (book for sale, paid MOOC certificate track)
#   none     not available publicly (e.g. only on the university LMS)
#   unknown  could not be determined
# `via` names the offering that provides the material.
#
# Every entry was checked against its web pages in November 2026 (field `checked`).

groups:
  - id: course
    name: University courses
    description: Courses with public lecture material (slides, notes, videos or assignments).
  - id: mooc
    name: MOOCs and short online courses
    description: Self-paced online courses that are not part of a university course listed above.
  - id: book
    name: Textbooks
    description: Textbooks used by the courses above, and other free or open textbooks.
  - id: video
    name: Video lecture series
    description: Video collections that are not tied to a single course above.
  - id: labs
    name: Labs, exercises and notebooks
    description: Ready-to-use exercises, labs and Jupyter notebooks.
  - id: learning
    name: Robot learning, physical AI and embodied AI
    description: Courses and tutorials on learning-based robotics, and introductions to physical and embodied AI.
  - id: software
    name: Simulators and software for teaching
    description: Simulators, libraries and tools used by the courses above.

topics:
  architectures: Architectures and behaviours
  kinematics: Kinematics
  dynamics: Dynamics
  control: Control
  sensors: Sensors
  perception: Perception and vision
  estimation: Estimation and filtering
  localization: Localization
  slam: Mapping and SLAM
  planning: Motion planning
  manipulation: Manipulation
  aerial: Aerial robots
  driving: Autonomous driving
  learning: Robot learning (RL, imitation, foundation models)
  ros: ROS

resources:

